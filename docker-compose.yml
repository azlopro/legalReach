services:
  # PostgreSQL Database Service
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env # Load environment variables from .env file
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Expose PostgreSQL port to the host machine
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist database data
    networks:
      - app-network
    # ADD THIS HEALTHCHECK BLOCK 👇
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Go Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000" # Expose backend port
    env_file:
      - .env # Load environment variables
    volumes:
      - ./backend/leads.db:/app/leads.db
      - ./backend/credentials:/app/credentials # <-- ADD THIS LINE
    # UPDATE THE depends_on BLOCK LIKE THIS 👇
    depends_on:
      db:
        condition: service_healthy # Wait for the db to be healthy
    networks:
      - app-network

  # Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80" # Expose frontend port
    networks:
      - app-network

# Define the network for services to communicate
networks:
  app-network:
    driver: bridge

# Define the volume for persistent data
volumes:
  postgres_data:
    driver: local