<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2d3748;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #718096;
            font-size: 1.1rem;
        }

        .dashboard {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .view-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 15px 25px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #718096;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .tab:hover:not(.active) {
            background: #e2e8f0;
            color: #4a5568;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 20px 15px;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-new {
            background: #e6fffa;
            color: #38b2ac;
            border: 1px solid #38b2ac;
        }

        .status-contacted {
            background: #f0fff4;
            color: #68d391;
            border: 1px solid #68d391;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            border-color: #667eea;
            background: #f8fafc;
        }

        .page-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #2d3748;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, #48bb78, #38a169);
        }

        .notification.error {
            background: linear-gradient(135deg, #f56565, #e53e3e);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .file-input {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                justify-content: center;
            }

            .modal-content {
                padding: 20px;
                margin: 20px;
                width: calc(100% - 40px);
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lead Management</h1>
            <p>Manage your leads efficiently with our powerful dashboard</p>
        </div>

        <div class="dashboard">
            <div class="view-tabs">
                <button class="tab active" onclick="switchView('new')" id="newTab">
                    New Leads (<span id="newCount">0</span>)
                </button>
                <button class="tab" onclick="switchView('contacted')" id="contactedTab">
                    Contacted Leads (<span id="contactedCount">0</span>)
                </button>
            </div>

            <div class="controls">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by name or email...">
                </div>
                
                <button class="btn btn-primary" onclick="triggerFileUpload()">
                    <span>📁</span> Import from CSV
                </button>
                
                <button class="btn btn-secondary" id="sendEmailBtn" onclick="openEmailModal()" disabled>
                    <span>✉️</span> Send Email to Selected
                </button>
                
                <button class="btn btn-secondary" id="exportBtn" onclick="exportSelected()" disabled>
                    <span>📤</span> Export Selected to CSV
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="50">
                                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                            </th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody">
                        <!-- Leads will be populated here -->
                    </tbody>
                </table>
                
                <div id="emptyState" class="empty-state" style="display: none;">
                    <h3>No leads found</h3>
                    <p>Start by importing leads from a CSV file</p>
                </div>
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination will be populated here -->
            </div>
        </div>
    </div>

    <!-- Email Modal -->
    <div id="emailModal" class="modal">
        <div class="modal-content">
            <h2>Send Email to Selected Leads</h2>
            <div class="form-group">
                <label for="emailSubject">Subject</label>
                <input type="text" id="emailSubject" placeholder="Enter email subject...">
            </div>
            <div class="form-group">
                <label for="emailBody">Message</label>
                <textarea id="emailBody" placeholder="Enter your message..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeEmailModal()">Cancel</button>
                <button class="btn btn-primary" onclick="sendEmails()">
                    <span id="sendBtnText">Send Email</span>
                    <span id="sendBtnLoading" class="loading" style="display: none;"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="csvFileInput" class="file-input" accept=".csv" onchange="handleFileUpload(event)">

    <script>
        // Sample data for demonstration
        let allLeads = [
            { id: 1, name: "John Doe", email: "john@example.com", status: "new" },
            { id: 2, name: "Jane Smith", email: "jane@example.com", status: "contacted" },
            { id: 3, name: "Mike Johnson", email: "mike@example.com", status: "new" },
            { id: 4, name: "Sarah Wilson", email: "sarah@example.com", status: "new" },
            { id: 5, name: "David Brown", email: "david@example.com", status: "contacted" },
            { id: 6, name: "Lisa Garcia", email: "lisa@example.com", status: "new" },
            { id: 7, name: "Tom Anderson", email: "tom@example.com", status: "new" },
            { id: 8, name: "Emily Davis", email: "emily@example.com", status: "contacted" }
        ];

        let filteredLeads = [];
        let currentPage = 1;
        let currentView = 'new'; // 'new' or 'contacted'
        const leadsPerPage = 50;
        let selectedLeads = new Set();

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            updateFilteredLeads();
            renderLeads();
            updateButtons();
            updateTabCounts();
        });

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            
            // Close modal when clicking outside
            document.getElementById('emailModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeEmailModal();
                }
            });
        }

        function switchView(view) {
            currentView = view;
            currentPage = 1;
            selectedLeads.clear();
            
            // Update tab appearance
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(view + 'Tab').classList.add('active');
            
            updateFilteredLeads();
            renderLeads();
            updateButtons();
        }

        function updateFilteredLeads() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            // Filter by current view first
            let viewFilteredLeads = allLeads.filter(lead => lead.status === currentView);
            
            // Then apply search filter
            if (searchTerm === '') {
                filteredLeads = viewFilteredLeads;
            } else {
                filteredLeads = viewFilteredLeads.filter(lead => 
                    lead.name.toLowerCase().includes(searchTerm) || 
                    lead.email.toLowerCase().includes(searchTerm)
                );
            }
        }

        function updateTabCounts() {
            const newCount = allLeads.filter(lead => lead.status === 'new').length;
            const contactedCount = allLeads.filter(lead => lead.status === 'contacted').length;
            
            document.getElementById('newCount').textContent = newCount;
            document.getElementById('contactedCount').textContent = contactedCount;
        }

        function handleSearch() {
            updateFilteredLeads();
            currentPage = 1;
            selectedLeads.clear();
            renderLeads();
            updateButtons();
        }

        function renderLeads() {
            const tbody = document.getElementById('leadsTableBody');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredLeads.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                
                // Update empty state message based on current view
                const emptyTitle = emptyState.querySelector('h3');
                const emptyText = emptyState.querySelector('p');
                
                if (currentView === 'new') {
                    emptyTitle.textContent = 'No new leads found';
                    emptyText.textContent = 'Start by importing leads from a CSV file';
                } else {
                    emptyTitle.textContent = 'No contacted leads found';
                    emptyText.textContent = 'Leads will appear here after you send emails to them';
                }
                
                document.querySelector('.table-container table').style.display = 'none';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            document.querySelector('.table-container table').style.display = 'table';
            document.getElementById('pagination').style.display = 'flex';

            const startIndex = (currentPage - 1) * leadsPerPage;
            const endIndex = startIndex + leadsPerPage;
            const pageLeads = filteredLeads.slice(startIndex, endIndex);

            tbody.innerHTML = pageLeads.map(lead => `
                <tr>
                    <td>
                        <input type="checkbox" 
                               ${selectedLeads.has(lead.id) ? 'checked' : ''}
                               onchange="toggleLead(${lead.id})">
                    </td>
                    <td>${lead.name}</td>
                    <td>${lead.email}</td>
                    <td>
                        <span class="status-badge status-${lead.status}">
                            ${lead.status === 'new' ? 'New' : 'Contacted'}
                        </span>
                    </td>
                </tr>
            `).join('');

            renderPagination();
            updateSelectAllCheckbox();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredLeads.length / leadsPerPage);
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let paginationHTML = '';
            
            // Previous button
            if (currentPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})">‹ Previous</button>`;
            }

            // Page numbers
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            // Next button
            if (currentPage < totalPages) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})">Next ›</button>`;
            }

            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            currentPage = page;
            renderLeads();
        }

        function toggleLead(leadId) {
            if (selectedLeads.has(leadId)) {
                selectedLeads.delete(leadId);
            } else {
                selectedLeads.add(leadId);
            }
            updateButtons();
            updateSelectAllCheckbox();
        }

        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const startIndex = (currentPage - 1) * leadsPerPage;
            const endIndex = startIndex + leadsPerPage;
            const pageLeads = filteredLeads.slice(startIndex, endIndex);

            if (selectAllCheckbox.checked) {
                pageLeads.forEach(lead => selectedLeads.add(lead.id));
            } else {
                pageLeads.forEach(lead => selectedLeads.delete(lead.id));
            }

            renderLeads();
            updateButtons();
        }

        function updateSelectAllCheckbox() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const startIndex = (currentPage - 1) * leadsPerPage;
            const endIndex = startIndex + leadsPerPage;
            const pageLeads = filteredLeads.slice(startIndex, endIndex);
            
            if (pageLeads.length === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
                return;
            }

            const selectedCount = pageLeads.filter(lead => selectedLeads.has(lead.id)).length;
            
            if (selectedCount === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            } else if (selectedCount === pageLeads.length) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = true;
            }
        }

        function updateButtons() {
            const sendEmailBtn = document.getElementById('sendEmailBtn');
            const exportBtn = document.getElementById('exportBtn');
            
            // Send Email button should only be enabled in 'new' view with selections
            if (currentView === 'new') {
                sendEmailBtn.style.display = 'inline-flex';
                sendEmailBtn.disabled = selectedLeads.size === 0;
            } else {
                sendEmailBtn.style.display = 'none';
            }

            // Export button is available in both views when leads are selected
            exportBtn.disabled = selectedLeads.size === 0;
        }

        function triggerFileUpload() {
            document.getElementById('csvFileInput').click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.name.toLowerCase().endsWith('.csv')) {
                showNotification('Please select a CSV file.', 'error');
                return;
            }

            // Show loading state
            const importBtn = document.querySelector('button[onclick="triggerFileUpload()"]');
            const originalHTML = importBtn.innerHTML;
            importBtn.innerHTML = '<span class="loading"></span> Importing...';
            importBtn.disabled = true;

            // Simulate file processing
            setTimeout(() => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const csv = e.target.result;
                        const lines = csv.split('\n').filter(line => line.trim());
                        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                        
                        if (!headers.includes('name') || !headers.includes('email')) {
                            throw new Error('CSV must contain "name" and "email" columns');
                        }

                        const nameIndex = headers.indexOf('name');
                        const emailIndex = headers.indexOf('email');
                        
                        let addedCount = 0;
                        let duplicateCount = 0;
                        const existingEmails = new Set(allLeads.map(lead => lead.email.toLowerCase()));

                        for (let i = 1; i < lines.length; i++) {
                            const values = lines[i].split(',').map(v => v.trim());
                            const name = values[nameIndex];
                            const email = values[emailIndex];

                            if (name && email && email.includes('@')) {
                                if (existingEmails.has(email.toLowerCase())) {
                                    duplicateCount++;
                                } else {
                                    const newLead = {
                                        id: Date.now() + Math.random(),
                                        name: name,
                                        email: email,
                                        status: 'new'
                                    };
                                    allLeads.push(newLead);
                                    existingEmails.add(email.toLowerCase());
                                    addedCount++;
                                }
                            }
                        }

                        if (addedCount > 0) {
                            updateFilteredLeads();
                            updateTabCounts();
                            renderLeads();
                            showNotification(`Success: ${addedCount} leads added${duplicateCount > 0 ? `, ${duplicateCount} duplicates skipped` : ''}.`, 'success');
                        } else {
                            showNotification('No new leads were added.', 'error');
                        }

                    } catch (error) {
                        showNotification(`Error processing file: ${error.message}`, 'error');
                    }

                    // Reset button
                    importBtn.innerHTML = originalHTML;
                    importBtn.disabled = false;
                };
                reader.readAsText(file);
            }, 1500);

            // Clear the input
            event.target.value = '';
        }

        function openEmailModal() {
            document.getElementById('emailModal').style.display = 'block';
            document.getElementById('emailSubject').focus();
        }

        function closeEmailModal() {
            document.getElementById('emailModal').style.display = 'none';
            document.getElementById('emailSubject').value = '';
            document.getElementById('emailBody').value = '';
        }

        function sendEmails() {
            const subject = document.getElementById('emailSubject').value.trim();
            const body = document.getElementById('emailBody').value.trim();

            if (!subject || !body) {
                showNotification('Please fill in both subject and message.', 'error');
                return;
            }

            if (selectedLeads.size === 0) {
                showNotification('No leads selected.', 'error');
                return;
            }

            // Show loading state
            const sendBtn = document.querySelector('#emailModal .btn-primary');
            document.getElementById('sendBtnText').style.display = 'none';
            document.getElementById('sendBtnLoading').style.display = 'inline-block';
            sendBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                // Update lead statuses (all selected leads in 'new' view should become 'contacted')
                Array.from(selectedLeads).forEach(leadId => {
                    const lead = allLeads.find(l => l.id === leadId);
                    if (lead && lead.status === 'new') {
                        lead.status = 'contacted';
                    }
                });

                // Clear selection and refresh current view
                const emailedCount = selectedLeads.size;
                selectedLeads.clear();
                updateFilteredLeads();
                updateTabCounts();
                renderLeads();
                updateButtons();
                
                // Reset modal and show success
                closeEmailModal();
                showNotification(`Email sent successfully to ${emailedCount} lead${emailedCount > 1 ? 's' : ''}.`, 'success');

                // Reset button
                document.getElementById('sendBtnText').style.display = 'inline';
                document.getElementById('sendBtnLoading').style.display = 'none';
                sendBtn.disabled = false;
            }, 2000);
        }

        function exportSelected() {
            if (selectedLeads.size === 0) {
                showNotification('No leads selected for export.', 'error');
                return;
            }

            const selectedLeadsData = Array.from(selectedLeads).map(id => 
                allLeads.find(lead => lead.id === id)
            ).filter(lead => lead);

            // Create CSV content
            const headers = ['Name', 'Email', 'Status'];
            const csvContent = [
                headers.join(','),
                ...selectedLeadsData.map(lead => 
                    `"${lead.name}","${lead.email}","${lead.status === 'new' ? 'New' : 'Contacted'}"`
                )
            ].join('\n');

            // Create and download file
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `leads_export_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);

            showNotification(`Exported ${selectedLeadsData.length} lead${selectedLeadsData.length > 1 ? 's' : ''} to CSV.`, 'success');
        }

        function showNotification(message, type) {
            // Remove existing notifications
            const existingNotifications = document.querySelectorAll('.notification');
            existingNotifications.forEach(notif => notif.remove());

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            // Show notification
            setTimeout(() => notification.classList.add('show'), 100);

            // Hide notification after 4 seconds
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
